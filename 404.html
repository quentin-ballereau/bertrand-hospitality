<head>
<meta charset="utf-8">

<meta name="description" content="Cette page n’existe pas ou a changé d’adresse. Promenez-vous parmi nos maisons, ou revenez à l’accueil.">

<style>
/* Page 404, d'après la galerie de discoverylandco.com : un mur de photos de nos maisons, sans fin, que l'on fait glisser
   dans tous les sens (souris, molette, doigt, flèches du clavier). À l'arrivée, les photos sont serrées au centre puis
   s'écartent. Le titre reste au milieu : à l'encre sur le crème, en blanc sur les photos. */
html,body{height:100%;overflow:hidden;background:var(--cream);overscroll-behavior:none}
.nav{position:fixed;color:var(--ink)}
/* un bandeau crème sous l'en-tête, pour que le menu reste lisible quand les photos passent dessous */
.er-bar{position:fixed;left:0;right:0;top:0;z-index:4;height:96px;background:var(--cream);border-bottom:1px solid var(--line);pointer-events:none}
.nav{z-index:8}

.er-wall{position:fixed;inset:0;z-index:1;overflow:hidden;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.er-wall.is-dragging{cursor:grabbing}
.er-tile{position:absolute;left:0;top:0;margin:0;background:var(--cream-2);will-change:transform;overflow:hidden}
.er-tile img{display:block;width:100%;height:100%;object-fit:cover;opacity:0;scale:1.08;transition:opacity 1.2s var(--ease),scale 2.4s var(--expo);-webkit-user-drag:none;pointer-events:none}
.er-tile img.is-on{opacity:1;scale:1}
/* un voile noir très léger, pour que le texte blanc se lise un peu mieux sans changer les photos */
.er-tile::after{content:"";position:absolute;inset:0;background:rgba(29,29,27,.12);pointer-events:none}

/* le titre, au centre, au-dessus des photos : à l'encre sur le crème, en blanc là où une photo passe dessous.
   Deux couches identiques : l'encre en dessous, le blanc au-dessus, découpé à la forme des photos (js : clip-path). */
.er-title{position:fixed;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:32px;pointer-events:none;color:var(--ink);text-align:center;padding:0 var(--gutter)}
.er-title--w{z-index:3;color:#fff;clip-path:polygon(0 0,0 0,0 0)}
.er-title h1{margin:0;font-family:var(--serif);font-weight:400;font-size:48px;line-height:1.1;letter-spacing:.02em;text-transform:uppercase;text-box:trim-both cap alphabetic}
.er-title sup{font-size:.375em;letter-spacing:.04em;vertical-align:top;margin-left:.25em;position:relative;top:-.2em}
.er-title p{margin:0;font-family:var(--caps);font-size:12px;letter-spacing:.14em;text-transform:uppercase;line-height:1.3;color:var(--taupe);text-box:trim-both cap alphabetic}
.er-title .cta{pointer-events:auto}
.er-title--w p,.er-title--w .cta{color:#fff}
.er-title--w .cta{pointer-events:none}
.er-title > *{opacity:0;translate:0 16px;transition:opacity 1.2s var(--expo),translate 1.2s var(--expo)}
.is-ready .er-title > *{opacity:1;translate:none}
.is-ready .er-title p{transition-delay:.12s}
.is-ready .er-title .cta{transition-delay:.24s}

@media (max-width:767px){
  .er-bar{height:72px}
  .er-title{gap:24px}
  .er-title h1{font-size:30px}
}
@media (prefers-reduced-motion:reduce){.er-title > *{transition:none}}
</style>
</head>
<body class="js">
<div class="er-bar" aria-hidden="true"></div>

<header class="nav">
  <button class="nav-menu caps" type="button" aria-label="Ouvrir le menu"><i class="nav-ico" aria-hidden="true"></i><span>menu</span></button>
  <a class="nav-logo" href="index.html" aria-label="Bertrand Hospitality, accueil"><img src="assets/logo-bh-dark.svg" width="164" height="32" alt="Bertrand Hospitality"></a>
  <div class="nav-right">
    <div class="nav-quote">
      <a class="nav-cta ul caps" href="devis.html"><span class="cta-long">Demander un </span>devis</a>
      <div class="nav-quote-pop"><span class="caps">Ou appelez-nous</span><a href="tel:+33764070661">07 64 07 06 61</a></div>
    </div>
  </div>
</header>

<main>
  <div class="er-wall" id="wall" aria-hidden="true"></div>
  <div class="er-title" id="title">
    <h1>Page introuvable<sup>(404)</sup></h1>
    <p>Glissez pour explorer nos maisons</p>
    <a class="cta ul caps" href="index.html">Retour à l’accueil</a>
  </div>
</main>

<script src="js/data.js?v=10"></script>
<script src="js/menu.js?v=15"></script>
<script>
(() => {
  const wall = document.getElementById("wall");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

  // les photos (assets/erreur, 520 px de large) et leur format ; mélangées une fois pour toutes
  const PHOTOS = [["amanie",1.5],["angelina-alma",1.5],["angelina-rivoli",1.5],["angelina-versailles",1.5],["au-pied-de-cochon",1.5],["auteuil-brasserie",1.5],["bofinger",1.5],["copenhague",1.5],["dancing-coupole",1.5],["flora-danica",1.4],["grand-cafe-capucines",1.5],["hotel-norman",1.5],["la-coupole",1.5],["la-flottille-versailles",1.5],["lalsace",1.5],["les-2-stations",1.5],["lesmarionnettes",1.5],["lile",1.5],["lipp",1.5],["lorraine",1.5],["meida",1.5],["pavillon-lile",1.5],["polpo",1.5],["procope",1.5],["public-house",1.5],["rosalie-disney-village-77",1.88],["sirwinston",1.5],["terminus-nord",1.5],["terrasse-de-madame",1.5],["vaudeville",1.5],
    ["polpo-01",.667],["polpo-02",.667],["polpo-03",.667],["polpo-04",.667],["polpo-05",.667],["polpo-06",.667],["polpo-07",.667],["polpo-08",.667],["polpo-09",.667],["polpo-10",.667],["polpo-11",.667],["polpo-12",.667],["polpo-13",.667],["polpo-14",.667],["polpo-15",.667],["polpo-16",.667],
    ["evt-auteuil",1.5],["evt-coupole",1.5],["evt-ile",1.5],["evt-meida",1.5],["evt-polpo",1.5],["evt-procope",1.5],["evt-public-house-bar",1.5],["evt-public-house-etage",1.5],["evt-public-house-salon",1.5],["evt-salon-dore",1.5],
    ["assiette",.667],["seine",.667],["plats",1.5],["terrasse",1.5]];
  let seed = 7;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (let i = PHOTOS.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [PHOTOS[i], PHOTOS[j]] = [PHOTOS[j], PHOTOS[i]]; }
  const N = PHOTOS.length;
  const mod = (a, n) => ((a % n) + n) % n;
  const photoAt = (c, r) => PHOTOS[mod(c * 7 + r * 19, N)];   // deux voisines ne montrent jamais la même photo

  // la grille : une case par photo, les colonnes impaires un peu décalées, comme posées à la main
  let CW, CH, TW, W, H;
  const size = () => {
    W = innerWidth; H = innerHeight;
    const m = W < 768;
    TW = m ? 150 : 260; CW = m ? 196 : 372; CH = m ? 200 : 300;
  };
  size();

  // le déplacement : la cible suit la souris, la position la rejoint en douceur
  let x = -CW / 2, y = -CH / 2, tx = x, ty = y;
  // à l'arrivée, tout le mur glisse doucement jusqu'à sa place, chaque photo à sa propre vitesse, comme posée sur l'eau
  let intro = reduce ? 0 : 1;   // de 1 (début) à 0 (en place)
  const t0 = performance.now() + 150, DX = 160, DY = 110;
  const depth = (c, r) => .55 + mod(c * 37 + r * 61, 10) / 10;   // de 0,55 à 1,45 selon la photo

  // le titre en blanc, par-dessus, visible seulement là où une photo passe sous lui
  const ink = document.getElementById("title"), white = ink.cloneNode(true);
  white.removeAttribute("id"); white.classList.add("er-title--w"); white.setAttribute("aria-hidden", "true");
  white.querySelector("a").setAttribute("tabindex", "-1");
  ink.after(white);
  let box;   // la zone du titre, du sous-titre et du lien
  const measure = () => {
    const r = [...ink.children].map(c => c.getBoundingClientRect());
    box = {l:Math.min(...r.map(q => q.left)) - 24, r:Math.max(...r.map(q => q.right)) + 24, t:Math.min(...r.map(q => q.top)) - 24, b:Math.max(...r.map(q => q.bottom)) + 24};   // avec de la marge : le texte monte encore à l'arrivée
  };

  const live = new Map(), pool = [];
  const tileFor = key => {
    let t = live.get(key);
    if (t) return t;
    t = pool.pop();
    if (!t) { t = document.createElement("figure"); t.className = "er-tile"; t.appendChild(new Image()); wall.appendChild(t); }
    live.set(key, t);
    return t;
  };

  const render = now => {
    if (intro > 0) {
      const k = Math.min(1, Math.max(0, (now - t0) / 2800));
      intro = 1 - (1 - Math.pow(2, -10 * k));   // expo
      if (k >= 1) intro = 0;
    }
    x += (tx - x) * .1; y += (ty - y) * .1;
    const pad = 160;
    // les cases à l'écran, en tenant compte du resserrement de l'arrivée
    const ex = DX * 1.5 * intro, ey = DY * 1.5 * intro;   // les photos qui arrivent de hors champ
    const wx0 = -pad - x - ex, wx1 = W + pad - x;
    const wy0 = -pad - y - CH - ey, wy1 = H + pad - y;
    const c0 = Math.floor(wx0 / CW), c1 = Math.floor(wx1 / CW), r0 = Math.floor(wy0 / CH), r1 = Math.floor(wy1 / CH);
    const seen = new Set(), cut = [];
    for (let c = c0; c <= c1; c++) for (let r = r0; r <= r1; r++) {
      const key = c + "," + r; seen.add(key);
      const t = tileFor(key), [name, ratio] = photoAt(c, r);
      const w = ratio < 1 ? TW * .62 : TW, h = w / ratio;
      const mx = c * CW + CW / 2 + x, my = r * CH + CH / 2 + y + (mod(c, 2) ? CH * .38 : 0);
      const d = intro ? depth(c, r) * intro : 0;
      const sx = mx + DX * d - w / 2, sy = my + DY * d - h / 2;
      t.style.width = w + "px"; t.style.height = h + "px";
      t.style.transform = `translate3d(${sx.toFixed(1)}px,${sy.toFixed(1)}px,0)`;
      if (box && sx < box.r && sx + w > box.l && sy < box.b && sy + h > box.t && t.firstChild.classList.contains("is-on"))
        cut.push(`M${sx.toFixed(1)} ${sy.toFixed(1)}h${w.toFixed(1)}v${h.toFixed(1)}h${(-w).toFixed(1)}Z`);
      const img = t.firstChild, src = `assets/erreur/${name}.webp`;
      if (img.dataset.src !== src) {
        img.dataset.src = src; img.classList.remove("is-on");
        img.onload = () => img.classList.add("is-on");
        img.src = src; img.alt = "";
      }
    }
    white.style.clipPath = cut.length ? `path("${cut.join("")}")` : "polygon(0 0,0 0,0 0)";
    for (const [key, t] of live) if (!seen.has(key)) { live.delete(key); t.style.transform = "translate3d(-9999px,0,0)"; pool.push(t); }
    requestAnimationFrame(render);
  };
  requestAnimationFrame(render);

  // glisser à la souris ou au doigt, avec un peu d'élan au lâcher
  let drag = null;
  wall.addEventListener("pointerdown", e => {
    drag = {px:e.clientX, py:e.clientY, vx:0, vy:0, t:performance.now()};
    wall.setPointerCapture(e.pointerId); wall.classList.add("is-dragging");
  });
  wall.addEventListener("pointermove", e => {
    if (!drag) return;
    const dx = e.clientX - drag.px, dy = e.clientY - drag.py, now = performance.now(), dt = Math.max(1, now - drag.t);
    tx += dx; ty += dy; drag.vx = dx / dt; drag.vy = dy / dt;
    drag.px = e.clientX; drag.py = e.clientY; drag.t = now;
  });
  const end = () => { if (!drag) return; tx += drag.vx * 220; ty += drag.vy * 220; drag = null; wall.classList.remove("is-dragging"); };
  wall.addEventListener("pointerup", end); wall.addEventListener("pointercancel", end);
  // la molette (et le pavé tactile) déplacent le mur dans les deux sens
  addEventListener("wheel", e => { e.preventDefault(); tx -= e.deltaX; ty -= e.deltaY; }, {passive:false});
  addEventListener("keydown", e => {
    const d = {ArrowLeft:[CW, 0], ArrowRight:[-CW, 0], ArrowUp:[0, CH], ArrowDown:[0, -CH]}[e.key];
    if (d && !e.target.closest("input,textarea")) { tx += d[0]; ty += d[1]; }
  });
  addEventListener("resize", () => { size(); measure(); });
  document.fonts.ready.then(measure); measure();

  requestAnimationFrame(() => requestAnimationFrame(() => document.body.classList.add("is-ready")));
})();
</script>
</body>
</html>
