<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Typographies : trois options — Bertrand Hospitality</title>
<link rel="icon" href="favicon.ico" sizes="48x48">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/base.css?v=23">
<link rel="stylesheet" href="css/home.css?v=35">
<style>
/* Présentation des trois options typographiques au client (js/typo-variante.js) :
   une barre en haut (option A, B ou C, page du site, vue), le vrai site dessous, à pleine taille.
   Changer d'option garde la page et la position dans la page ; le lien (#b/hotels) rouvre la même vue.
   Vue « Côte à côte » : les mêmes composants dans les trois options (typo-specimen.html). */
html,body{background:var(--cream);height:100%}
body{overflow:hidden}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:root{--bar-h:64px}

/* ---------- barre ---------- */
.tb{position:fixed;inset:0 0 auto;height:var(--bar-h);z-index:10;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:24px;padding:0 24px;background:var(--cream);box-shadow:0 1px 0 var(--line)}
.tb-brand{display:flex;flex-direction:column;gap:6px;min-width:0}
.tb-brand b{font-family:var(--caps);font-weight:400;font-size:12px;letter-spacing:.11em;text-transform:uppercase;color:var(--taupe);white-space:nowrap}
.tb-desc{font-size:12px;font-weight:300;line-height:1.3;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-block:.3em;margin-block:-.3em}
.seg3{display:flex;padding:3px;border:1px solid var(--line);background:#fff;border-radius:999px}
.seg3 button{display:flex;align-items:baseline;gap:8px;height:36px;padding:0 18px;border-radius:999px;align-items:center;white-space:nowrap;color:var(--ink-soft);transition:background .3s var(--ease),color .3s var(--ease)}
.seg3 button span{font-family:var(--caps);font-size:12px;letter-spacing:.11em;text-transform:uppercase}
.seg3 button i{font-style:normal;font-size:13px;font-weight:300}
.seg3 button[aria-pressed="true"]{background:var(--ink);color:#fff}
.seg3 button:not([aria-pressed="true"]):hover{background:var(--cream-2)}
.tb-right{display:flex;align-items:center;justify-content:flex-end;gap:16px;min-width:0}
.tb-sel{position:relative}
.tb-sel select{appearance:none;-webkit-appearance:none;height:36px;padding:0 34px 0 14px;border:1px solid var(--line);border-radius:999px;background:#fff;font:300 13px/34px var(--sans);color:var(--ink);cursor:pointer}
.tb-sel::after{content:"";position:absolute;right:15px;top:50%;width:6px;height:6px;margin-top:-5px;border-right:1px solid var(--ink);border-bottom:1px solid var(--ink);transform:rotate(45deg);pointer-events:none}
.tb-view{height:36px;padding:0 4px;font-family:var(--caps);font-size:12px;letter-spacing:.11em;text-transform:uppercase;color:var(--taupe);white-space:nowrap}
.tb-view:hover{color:var(--ink)}

/* ---------- le site ---------- */
.stage-site{position:fixed;inset:var(--bar-h) 0 0;background:var(--cream)}
.stage-site iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--cream);transition:opacity .35s var(--ease)}
.stage-site iframe.is-back{opacity:0;pointer-events:none}

/* ---------- côte à côte ---------- */
.side{position:fixed;inset:var(--bar-h) 0 0;overflow:auto;background:var(--cream);display:none}
body.is-side .side{display:block}
body.is-side .stage-site{visibility:hidden}
body.is-side .seg3,body.is-side .tb-sel{visibility:hidden}
.side-in{max-width:1320px;margin:0 auto;padding:56px 24px 96px}
.side-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;align-items:start}
.side-col{display:flex;flex-direction:column;gap:20px}
.side-meta{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.side-meta .t-h3{font-size:28px}
.side-meta .tp-fonts{font-size:12px;color:var(--muted)}
.side-frame{display:block;width:100%;height:1500px;border:0;background:var(--cream);box-shadow:0 0 0 1px var(--line)}

@media (max-width:1099px){
  .tb-desc{display:none}
  .seg3 button{padding:0 14px}
}
@media (max-width:959px){ .tb-brand{display:none} .tb{grid-template-columns:auto 1fr} }
@media (max-width:767px){
  :root{--bar-h:104px}
  .tb{grid-template-columns:1fr auto;grid-template-rows:auto auto;gap:10px 12px;padding:10px 16px;align-content:center}
  .tb-brand{display:none}
  .seg3{grid-column:1 / -1;justify-content:stretch}
  .seg3 button{flex:1;justify-content:center;padding:0 8px}
  .seg3 button i{display:inline;font-size:12px}
  .tb-right{grid-column:1 / -1;justify-content:space-between}
  .side-grid{grid-template-columns:1fr;gap:64px}
}
</style>
</head>
<body>
<header class="tb">
  <div class="tb-brand">
    <b>Bertrand Hospitality · Typographies</b>
    <span class="tb-desc" id="desc"></span>
  </div>
  <div class="seg3" role="group" aria-label="Option typographique">
    <button type="button" data-o="a" aria-pressed="false"><span>A</span><i>Actuelle</i></button>
    <button type="button" data-o="b" aria-pressed="false"><span>B</span><i>Retouchée</i></button>
    <button type="button" data-o="c" aria-pressed="false"><span>C</span><i>Google Fonts</i></button>
  </div>
  <div class="tb-right">
    <label class="tb-sel"><span class="sr">Page du site</span>
      <select id="page">
        <option value="index">Accueil</option>
        <option value="lieux">Nos lieux</option>
        <option value="lieu">Fiche d’un lieu</option>
        <option value="offres">Événements</option>
        <option value="landing">Landing séminaire</option>
        <option value="hotels">Hôtels</option>
        <option value="nous-connaitre">Nous connaître</option>
        <option value="engagement">Engagement</option>
        <option value="blog">Blog</option>
        <option value="faq">FAQ</option>
        <option value="devis">Demande de devis</option>
      </select>
    </label>
    <button type="button" class="tb-view" id="view" aria-pressed="false">Côte à côte</button>
  </div>
</header>

<div class="stage-site" id="site">
  <iframe title="Le site dans l’option choisie"></iframe>
  <iframe title="" class="is-back" aria-hidden="true" tabindex="-1"></iframe>
</div>

<section class="side" aria-label="Les trois options côte à côte">
  <div class="side-in">
    <div class="side-grid">
      <article class="side-col"><div class="side-meta"><p class="t-cta t-eyebrow">Option A</p><h2 class="t-h3">Actuelle</h2><p class="tp-fonts">Ivar Display · Copperplate · Helvetica LT Std Light</p></div><iframe class="side-frame" data-src="typo-specimen.html?typo=a" title="Option A"></iframe></article>
      <article class="side-col"><div class="side-meta"><p class="t-cta t-eyebrow">Option B</p><h2 class="t-h3">Retouchée</h2><p class="tp-fonts">Ivar Display · Copperplate · Helvetica LT Std Light</p></div><iframe class="side-frame" data-src="typo-specimen.html?typo=b" title="Option B"></iframe></article>
      <article class="side-col"><div class="side-meta"><p class="t-cta t-eyebrow">Option C</p><h2 class="t-h3">Google Fonts</h2><p class="tp-fonts">Playfair Display · Josefin Sans · Inter Light</p></div><iframe class="side-frame" data-src="typo-specimen.html?typo=c" title="Option C"></iframe></article>
    </div>
  </div>
</section>

<script>
(() => {
  const DESC = {
    a: "Le site tel qu’il est aujourd’hui : Ivar Display, Copperplate, Helvetica LT Std Light.",
    b: "Les mêmes polices : texte courant un peu plus grand et plus nourri, petites capitales un peu plus grandes.",
    c: "Trois polices libres : Playfair Display (titres), Josefin Sans (tags et CTA), Inter Light (texte).",
  };
  const $ = id => document.getElementById(id);
  const btns = [...document.querySelectorAll(".seg3 button")], sel = $("page");
  let [front, back] = document.querySelectorAll("#site iframe");
  let opt = "a", page = "index", extra = "", busy = false;

  // l'état est dans l'adresse : typographies.html#b/hotels
  const read = () => {
    const [o, p] = location.hash.slice(1).split("/");
    if (["a", "b", "c"].includes(o)) opt = o;
    if (p && [...sel.options].some(x => x.value === p.split("?")[0])) { page = p.split("?")[0]; extra = p.includes("?") ? p.slice(p.indexOf("?") + 1) : ""; }
  };
  const write = () => history.replaceState(null, "", `#${opt}/${page}${extra ? "?" + extra : ""}`);
  const url = () => `${page}.html?typo=${opt}${extra ? "&" + extra : ""}`;
  const paint = () => {
    btns.forEach(b => b.setAttribute("aria-pressed", b.dataset.o === opt));
    $("desc").textContent = DESC[opt];
    sel.value = page;
  };

  // le site affiché : on suit ses changements de page (liens cliqués dans le site)
  function watch(fr) {
    fr.addEventListener("load", () => {
      if (fr !== front) return;
      try {
        const l = fr.contentWindow.location, name = l.pathname.split("/").pop().replace(/\.html$/, "") || "index";
        const ps = new URLSearchParams(l.search); ps.delete("typo");
        if ([...sel.options].some(x => x.value === name)) { page = name; extra = ps.toString(); paint(); write(); }
        keys(fr.contentWindow);
      } catch {}
    });
  }
  // changer d'option : la nouvelle version se charge derrière, à la même hauteur, puis passe devant en fondu
  function show(keepScroll) {
    if (busy) return; busy = true;
    let y = 0; try { y = keepScroll ? front.contentWindow.scrollY : 0; } catch {}
    const fr = back;
    const done = () => {
      fr.removeEventListener("load", onload);
      try { if (y) fr.contentWindow.scrollTo(0, y); } catch {}
      setTimeout(() => {
        fr.classList.remove("is-back"); fr.removeAttribute("aria-hidden"); fr.removeAttribute("tabindex"); fr.title = "Le site dans l’option choisie";
        front.classList.add("is-back"); front.setAttribute("aria-hidden", "true"); front.tabIndex = -1; front.title = "";
        [front, back] = [fr, front];
        keys(fr.contentWindow);
        busy = false;
      }, y ? 250 : 80);
    };
    const onload = () => setTimeout(done, 350);
    fr.addEventListener("load", onload);
    fr.src = url();
  }
  watch(front); watch(back);

  function setOpt(o) { if (o === opt && front.src) return; opt = o; paint(); write(); show(true); }
  btns.forEach(b => b.addEventListener("click", () => setOpt(b.dataset.o)));
  sel.addEventListener("change", () => { page = sel.value; extra = page === "lieu" ? "l=procope" : ""; paint(); write(); show(false); });

  // clavier : 1, 2, 3 ou les flèches gauche et droite (aussi quand le site a le focus)
  function onKey(e) {
    if (e.target.closest?.("input,textarea,select,[contenteditable]")) return;
    const i = ["a", "b", "c"].indexOf(opt);
    if (["1", "2", "3"].includes(e.key)) setOpt("abc"[+e.key - 1]);
    else if (e.key === "ArrowRight" && e.altKey) setOpt("abc"[(i + 1) % 3]);
    else if (e.key === "ArrowLeft" && e.altKey) setOpt("abc"[(i + 2) % 3]);
  }
  function keys(w) { try { if (!w._tbKeys) { w._tbKeys = 1; w.addEventListener("keydown", onKey); } } catch {} }
  addEventListener("keydown", onKey);

  // vue côte à côte : les échantillons ne se chargent qu'à la première ouverture
  $("view").addEventListener("click", () => {
    const on = document.body.classList.toggle("is-side");
    $("view").setAttribute("aria-pressed", on);
    $("view").textContent = on ? "Revenir au site" : "Côte à côte";
    if (on) document.querySelectorAll(".side-frame[data-src]").forEach(f => { f.src = f.dataset.src; f.removeAttribute("data-src"); f.addEventListener("load", fit); });
  });
  const sides = [...document.querySelectorAll(".side-frame")];
  function fit() {
    const h = Math.max(...sides.map(f => { try { return f.contentDocument.documentElement.scrollHeight; } catch { return 0; } }));
    if (h > 200) sides.forEach(f => f.style.height = h + "px");
    setTimeout(() => { const h2 = Math.max(...sides.map(f => { try { return f.contentDocument.documentElement.scrollHeight; } catch { return 0; } })); if (h2 > h) sides.forEach(f => f.style.height = h2 + "px"); }, 800);
  }

  read(); paint(); write();
  front.src = url();
  addEventListener("hashchange", () => { const o = opt, p = page; read(); paint(); if (p !== page) show(false); else if (o !== opt) show(true); });
})();
</script>
</body>
</html>
