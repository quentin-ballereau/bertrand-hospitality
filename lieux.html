<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nos lieux à privatiser — Bertrand Hospitality</title>
<meta name="description" content="Brasseries historiques, restaurants, péniche, jardins : tous les lieux Bertrand Hospitality à privatiser à Paris et en Île-de-France.">
<link rel="preload" href="fonts/IvarDisplay-Regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/Copperplate.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/base.css?v=8">
<link rel="stylesheet" href="css/menu.css?v=13">
<link rel="stylesheet" href="css/coverflow.css?v=9">
<style>
/* clip et non hidden : le focus d'une carte hors champ ne peut plus faire défiler la page */
html,body{background:var(--cream);height:100%;overflow:hidden;overflow:clip;overscroll-behavior:none}
body{color:var(--ink)}

.page{position:relative;height:100svh;min-height:640px;display:flex;flex-direction:column;padding:108px 0 36px}

/* en-tête de page */
.head{position:relative;z-index:7;text-align:center;padding:0 var(--gutter)}   /* la phrase reste nette au-dessus du voile : on la voit se réécrire */
.eyebrow{font-size:11px;color:var(--ink)}
.headline{max-width:940px;margin:18px auto 0;font-family:var(--serif);font-weight:400;font-size:26px;line-height:1.2;letter-spacing:.02em;text-transform:uppercase;color:var(--ink)}
.edit{display:inline-block;margin-top:16px;font-size:10px;color:var(--muted)}

/* la recherche n'apparaît qu'à la demande, juste sous le résumé */
.finder.is-floating{top:var(--finder-top,200px);bottom:auto;opacity:0;visibility:hidden;translate:0 -10px;
  transition:opacity .35s var(--ease),translate .55s var(--expo),visibility 0s .55s}
.finder.is-floating.is-shown{opacity:1;visibility:visible;translate:0 0;transition:opacity .35s var(--ease),translate .55s var(--expo),visibility 0s}
.finder.is-floating .pop{top:calc(100% + 8px);bottom:auto;transform:translateY(-8px)}
.finder.is-floating .pop.is-open{transform:none}
.finder.is-floating ~ .scrim.is-on, .scrim.is-on{background:rgba(250,248,247,.55);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}

/* le carrousel (css/coverflow.css) occupe la hauteur restante */
.cf{flex:1;margin-top:28px}

/* aucun résultat */
.empty{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:0 var(--gutter)}
.empty.is-on{display:flex}
.empty p{font-family:var(--serif);font-size:22px;line-height:1.2;letter-spacing:.02em;text-transform:uppercase}
.empty small{display:block;margin:14px auto 26px;max-width:420px;font-size:13.5px;font-weight:300;color:var(--ink-soft);line-height:1.5}
.empty .row{display:flex;gap:28px;justify-content:center}

/* intro */
.js .eyebrow, .js .headline, .js .edit, .js .info, .js .nav{opacity:0}

@media (max-width:767px){
  .page{padding:86px 0 24px}
  .finder.is-floating,.finder.is-floating.is-shown{translate:none}   /* pas de transform : les feuilles fixes se calent sur l'écran */
  .finder.is-floating .pop{top:auto;bottom:0;transform:translateY(100%)}
  .eyebrow{font-size:10px}
  .headline{font-size:19px;margin-top:12px}
  .cf{margin-top:14px}
}
</style>
</head>
<body class="js">

<header class="nav">
  <button class="nav-menu caps" type="button" aria-label="Ouvrir le menu"><i class="nav-ico" aria-hidden="true"></i><span>menu</span></button>
  <a class="nav-logo" href="index.html" aria-label="Bertrand Hospitality, accueil"><img src="assets/logo-bh-dark.svg" width="164" height="32" alt="Bertrand Hospitality"></a>
  <a class="nav-cta ul caps" href="https://evenement.groupe-bertrand.com/demande-de-devis/"><span class="cta-long">Demander un </span>devis</a>
</header>

<main class="page">
  <div class="head">
    <p class="eyebrow caps">Nos lieux à privatiser</p>
    <h1 class="headline" id="headline" aria-live="polite"></h1>
    <button class="edit ul caps" id="edit" type="button" aria-controls="finder" aria-expanded="false">Modifier la recherche</button>
  </div>

  <div class="cf" id="cf">
  <div class="stage" id="stage" aria-roledescription="carrousel" aria-label="Nos lieux">
    <div class="stage-inner" id="inner"></div>
    <div class="stage-veil" id="veil"></div>
    <div class="empty" id="empty">
      <div>
        <p>Rien ne correspond exactement à ces critères</p>
        <small>Élargissez un critère, ou laissez notre équipe, qui connaît chaque salon, composer une solution sur mesure.</small>
        <div class="row">
          <button class="cta ul caps" type="button" id="widen">Élargir la recherche</button>
          <a class="cta ul caps" href="https://evenement.groupe-bertrand.com/demande-de-devis/">Demander un devis</a>
        </div>
      </div>
    </div>
  </div>

  <div class="info" id="info">
    <p class="info-place caps" data-k="place"></p>
    <h2 class="info-name" data-k="name"></h2>
    <p class="info-tag" data-k="tag"></p>
    <a class="info-cta cta ul caps" data-k="cta">Découvrir le lieu</a>
  </div>
  </div>
</main>

<div class="finder is-light is-floating" id="finder" aria-hidden="true"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="js/data.js?v=9"></script>
<script src="js/menu.js?v=10"></script>
<script src="js/finder.js?v=6"></script>
<script src="js/coverflow.js?v=9"></script>
<script>
(() => {
const {results, capFor, fmtOf, secOf, FORMATS, BASE, toQuery, fromQuery} = BH;
const $ = id => document.getElementById(id);
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const state = fromQuery();
const cf = BH.coverflow($("cf"), {wheel:"all", format:() => state.format, query:() => toQuery(state)});

/* ---------- construction ---------- */
/* le titre reformule simplement la recherche */
const WHERE = {ouest:"aux Champs-Élysées et dans l’Ouest", centre:"entre l’Opéra, les Grands Boulevards et le centre",
  rg:"sur la Rive gauche", seine:"en bord de Seine", hors:"à Versailles et Disney Village"};
function renderHeadline() {
  const k = results(state).length, f = fmtOf(state.format);
  const count = k ? `${k} lieu${k > 1 ? "x" : ""}` : "Aucun lieu";
  const touched = state.format || state.guests || state.sector;
  $("headline").textContent = !touched ? `${count} à Paris et en Île-de-France`
    : `${count} pour ${f ? f.phrase : "votre événement"}${state.guests ? ` de ${state.guests} personnes` : ""}${state.sector ? " " + WHERE[state.sector] : ""}`;
}
function build(intro) {
  const list = results(state);
  $("empty").classList.toggle("is-on", !list.length);
  intro ? cf.set(list, {intro:true}) : cf.refresh(list);
}
let rebuildT;
function rebuild() {
  history.replaceState(null, "", "lieux.html" + (toQuery(state) ? "?" + toQuery(state) : ""));
  clearTimeout(rebuildT);
  rebuildT = setTimeout(() => build(false), 280);
}

/* ---------- recherche ---------- */
const finder = BH.finder($("finder"), {
  state,
  onChange: () => { renderHeadline(); rebuild(); },
  submitLabel: (k, touched) => touched ? (k ? `Voir les ${k} lieux` : "Nous consulter") : "Affiner",
  onSubmit: () => hideFinder(),

});

/* « Modifier la recherche » déplie la barre sous le titre ; un clic en dehors ou Échap la replie */
const finderEl = $("finder"), edit = $("edit");
const isOpen = () => finderEl.classList.contains("is-shown");
function showFinder() {
  finderEl.style.setProperty("--finder-top", document.querySelector(".head").getBoundingClientRect().bottom + 12 + "px");
  finderEl.classList.add("is-shown"); finderEl.removeAttribute("aria-hidden");
  edit.setAttribute("aria-expanded", "true");
  setTimeout(() => finder.open("format"), 150);
}
function hideFinder() {
  finder.close();
  finderEl.classList.remove("is-shown"); finderEl.setAttribute("aria-hidden", "true");
  edit.setAttribute("aria-expanded", "false");
}
edit.addEventListener("click", e => { e.stopPropagation(); isOpen() ? hideFinder() : showFinder(); });
// composedPath plutôt que closest : un choix re-rendu (les secteurs) est déjà détaché du DOM au moment du clic
document.addEventListener("click", e => { if (isOpen() && !e.composedPath().includes(finderEl)) hideFinder(); });
addEventListener("keydown", e => { if (e.key === "Escape") hideFinder(); });
$("widen").addEventListener("click", () => { state.sector = null; state.guests = null; finder.update(); });
renderHeadline();


/* ---------- intro de la page ---------- */
function start() {
  build(true);
  if (reduce) { gsap.set([".nav", ".eyebrow", ".headline", ".edit", ".info"], {opacity:1}); return; }
  gsap.timeline({defaults:{ease:"expo.out"}})
    .fromTo(".nav", {opacity:0, y:-8}, {opacity:1, y:0, duration:1.2}, .2)
    .fromTo([".eyebrow", ".headline", ".edit"], {opacity:0, y:12}, {opacity:1, y:0, duration:1.2, stagger:.08}, .35);   // la fiche du lieu est dévoilée par le carrousel
}
document.fonts.ready.then(start);
})();
</script>
</body>
</html>
